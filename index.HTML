<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Paper Hub</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="bg-icons">
    <span>✏️</span>
    <span>📘</span>
    <span>📚</span>
    <span>📖</span>
    <span>📝</span>
</div>

<header>
    <h1>Question Paper Hub</h1>
    <p>Previous Year Question Papers & Results · CBSE · ICSE · ISC</p>
</header>

<div class="section">
    <h2>Select Class</h2>
    <div class="grid">
        <div class="card class-card" onclick="selectClass('10',this)">
            <span class="icon">🎒</span>Class 10
        </div>
        <div class="card class-card" onclick="selectClass('12',this)">
            <span class="icon">🎓</span>Class 12
        </div>
    </div>
</div>

<div class="section">
    <h2>Select Subject</h2>
    <div class="grid">
        <div class="card subject-card" onclick="selectSubject('Maths',this)">
            <span class="icon">🧮</span>Mathematics
        </div>
        <div class="card subject-card" onclick="selectSubject('English',this)">
            <span class="icon">📖</span>English
        </div>
        <div class="card subject-card" onclick="selectSubject('Science',this)">
            <span class="icon">🧪</span>Science
        </div>
        <div class="card subject-card" onclick="selectSubject('AI',this)">
            <span class="icon">🤖</span>Artificial Intelligence
        </div>
    </div>
</div>

<div class="section">
    <h2>Select Board</h2>
    <div class="grid">
        <div class="card board-card" onclick="selectBoard('CBSE',this)">
            <span class="icon">🏫</span>CBSE
        </div>
        <div class="card board-card" onclick="selectBoard('ICSE',this)">
            <span class="icon">📗</span>ICSE
        </div>
        <div class="card board-card" onclick="selectBoard('ISC',this)">
            <span class="icon">📙</span>ISC
        </div>
    </div>
</div>

<div class="actions">
    <button onclick="viewPaper()">View Question Paper</button>
    <button onclick="viewResult()">View Result</button>
    <div id="msg"></div>
</div>

<div class="robot-wrap">
<svg class="robot" viewBox="0 0 160 260">
    <rect x="40" y="30" rx="25" width="80" height="60" fill="#f8fafc"/>
    <rect x="50" y="45" rx="15" width="60" height="30" fill="#111"/>
    <circle cx="70" cy="60" r="6" fill="#fff"/>
    <circle cx="90" cy="60" r="6" fill="#fff"/>
    <circle class="pupil" cx="70" cy="60" r="3"/>
    <circle class="pupil" cx="90" cy="60" r="3"/>
    <rect x="35" y="90" rx="30" width="90" height="120" fill="#f8fafc"/>
    <rect x="55" y="210" rx="8" width="18" height="40" fill="#d1fae5"/>
    <rect x="85" y="210" rx="8" width="18" height="40" fill="#d1fae5"/>
</svg>
</div>

<footer>Made for students ❤️</footer>
<script src="script.js" defer></script>

</body>
</html>
